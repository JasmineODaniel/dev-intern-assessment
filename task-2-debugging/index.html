<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>OSCE Results</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 16px;
            color: #1f2933;
            background: #ffffff;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #cbd2d9;
            padding: 6px 10px;
            text-align: left;
        }
        th {
            background: #f0f4f8;
        }
        .pass {
            color: #1b7a34;
            font-weight: bold;
        }
        .fail {
            color: #b42318;
            font-weight: bold;
        }
        .summary {
            display: flex;
            gap: 24px;
            margin: 16px 0;
        }
        .summary div {
            background: #f0f4f8;
            padding: 12px 16px;
            border-radius: 6px;
        }
        form {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
        }
        form label {
            display: inline-block;
            margin: 4px 12px 4px 0;
        }
        form input[type="number"] {
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>OSCE Results</h1>
    <p>Each station is marked out of 25. The pass mark is 50%.</p>

    <div class="summary">
        <div>Class average: <strong id="class-average"></strong></div>
        <div>Top 3 scores: <strong id="top-scores"></strong></div>
    </div>

    <table>
        <thead>
            <tr id="station-headers">
                <th>Student</th>
                <th id="total-header">Total</th>
                <th>Percentage</th>
                <th>Result</th>
                <th>Rank</th>
            </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>

    <form id="add-student-form">
        <h2>Add a student</h2>
        <label>Name <input type="text" id="student-name" required></label>
        <div id="score-inputs"></div>
        <button type="submit">Add student</button>
    </form>

    <script src="scoring.js"></script>
    <script src="app.js"></script>
</body>
</html>
